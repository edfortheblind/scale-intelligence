        <h1 data-source-node="n56"><a name="kanchor115" data-source-node="n57"></a>Create History? Field</h1>
        <p data-source-node="n58">This field allows you to turn on or off history 
 record generation for a specific transaction type, process, or quality 
 reason code.</p>
        <p data-source-node="n59"> </p>
        <p data-source-node="n60"> </p>
        <table style="width: 100%" cellspacing="0" width="100%" border="3" class="table_30" data-source-node="n61">

            <col data-source-node="n63">
            <tr data-source-node="n64">
                <td valign="top" class="td_11" data-source-node="n65">
                    <p align="center" data-source-node="n66">Y</p>
                </td>
                <td style="width: 87%" valign="top" width="87%" class="td_11" data-source-node="n67">
                    <p class="p_1" data-source-node="n68">If yes, then history record generation will 
 be turned on.</p>
                </td>
            </tr>
            <tr data-source-node="n69">
                <td valign="top" class="td_11" data-source-node="n70">
                    <p align="center" data-source-node="n71">N</p>
                </td>
                <td style="width: 87%" valign="top" width="87%" class="td_11" data-source-node="n72">
                    <p class="p_1" data-source-node="n73">If no, then history record generation will 
 be turned off.</p>
