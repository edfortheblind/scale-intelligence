        <h1 data-source-node="n56"><a name="kanchor813" data-source-node="n57"></a>Open for Shipments Field</h1>
        <p data-source-node="n58">This field indicates if a wave can accept 
 additional shipments.</p>
        <p data-source-node="n59"> </p>
        <table style="width: 100%" cellspacing="4" width="100%" border="1" class="table_21" data-source-node="n60">
            <tr data-source-node="n61">
                <td style="width: 19%" valign="top" width="19%" class="td_3" data-source-node="n62">
                    <p align="center" data-source-node="n63">Y</p>
                    <p align="left" class="p_13" data-source-node="n64"> </p>
                </td>
                <td style="width: 81%" valign="top" width="81%" class="td_3" data-source-node="n65">
                    <p data-source-node="n66">You can assign additional shipments to this wave.</p>
                    <p class="p_1" data-source-node="n67"> </p>
                </td>
            </tr>
            <tr data-source-node="n68">
                <td style="width: 19%" valign="top" width="19%" class="td_3" data-source-node="n69">
                    <p align="center" data-source-node="n70">N</p>
                </td>
                <td style="width: 81%" valign="top" width="81%" class="td_3" data-source-node="n71">
                    <p data-source-node="n72">You cannot assign additional shipments to this wave.</p>
                    <p class="p_1" data-source-node="n73"> </p>
                </td>
            </tr>
        </table>
        <p class="p_1" data-source-node="n74">  </p>
